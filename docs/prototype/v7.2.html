/* ---------- particles ---------- */
const fx=$('#fx');let fctx,particles=[],raf=null;
function fxsize(){fx.width=fx.offsetWidth;fx.height=fx.offsetHeight;fctx=fx.getContext('2d')}
function elXY(el){const d=$('#device').getBoundingClientRect(),r=el.getBoundingClientRect();return [r.left-d.left+r.width/2,r.top-d.top+r.height/2]}
function addP(x,y,n,rain){const cols=['#E8A83C','#1F6E63','#F4C879'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(rain?2:3)+Math.random()*(rain?3:5);particles.push({x:rain?Math.random()*fx.width:x,y:rain?-12:y,vx:rain?(Math.random()-.5)*1.4:Math.cos(a)*sp,vy:rain?sp:Math.sin(a)*sp-2,g:.13,life:1,em:Math.random()<.5?'✦':'◆',sz:9+Math.random()*8,c:cols[i%3],rot:Math.random()*6,vr:(Math.random()-.5)*.34})}}
function startFx(){if(raf)return;const step=()=>{fctx.clearRect(0,0,fx.width,fx.height);particles=particles.filter(p=>p.life>0&&p.y<fx.height+20);particles.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.011;fctx.save();fctx.globalAlpha=Math.max(0,p.life);fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillStyle=p.c;fctx.font=p.sz+'px serif';fctx.textAlign='center';fctx.fillText(p.em,0,0);fctx.restore()});if(particles.length)raf=requestAnimationFrame(step);else{raf=null;fctx&&fctx.clearRect(0,0,fx.width,fx.height)}};raf=requestAnimationFrame(step)}
function microGems(el){if(RM()||!el)return;fxsize();const xy=elXY(el);addP(xy[0],xy[1],5,false);startFx()}
function celebrate(){if(RM())return;
 if(window.confetti){try{const mc=window.confetti.create(fx,{resize:true,useWorker:false}),cols=['#E8A83C','#1F6E63','#F4C879','#A65F10'];mc({particleCount:90,spread:75,origin:{y:.55},colors:cols});setTimeout(()=>{mc({particleCount:45,angle:60,spread:60,origin:{x:0,y:.65},colors:cols});mc({particleCount:45,angle:120,spread:60,origin:{x:1,y:.65},colors:cols})},130);return}catch(e){}}
 fxsize();addP(0,0,80,true);addP(fx.width/2,fx.height*0.4,26,false);startFx()}

 const cents=ppl.map(p=>Math.round(p.raw/sr*tot));let diff=tot-cents.reduce((a,b)=>a+b,0);
 const ord=[...cents.keys()].sort((a,b)=>cents[b]-cents[a]);for(let k=0;k<Math.abs(diff);k++)cents[ord[k%ord.length]]+=diff>0?1:-1;
 ppl.forEach((p,i)=>p.t=cents[i]/100);return ppl}

/* ---------- feedback + review triage ---------- */
function openFeedback(){S.fbRating=0;openSheet(`<div class="grab"></div><div class="shpad"><h2 style="margin:6px 0 2px">${S.lang==='my'?'ဘယ်လိုလဲ?':'How was everything?'}</h2><p class="muted tiny" style="margin-top:0">${S.lang==='my'?'သင့် အကြံပြုချက်က မနက်ဖြန် အိုးကို ပုံဖော်ပါတယ်':'Your feedback shapes tomorrow’s pot.'}</p>
 <div class="emos" role="radiogroup" aria-label="Rate 1 to 5">${['😖','😕','😐','🙂','🤩'].map((e,i)=>`<button class="emo" role="radio" aria-checked="false" data-r="${i+1}" aria-label="${['Very unhappy','Unhappy','Okay','Happy','Delighted'][i]}" onclick="setRating(${i+1})"><span aria-hidden="true">${e}</span></button>`).join('')}</div>
 <div id="fbBody"></div></div>`)}
function setRating(r){S.fbRating=r;$$('.emo').forEach(b=>{const on=+b.dataset.r===r;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});track('feedback_rating',r);haptic(8);const body=$('#fbBody');
 if(r>=4){body.innerHTML=`<p style="font-weight:700">${S.lang==='my'?'ဝမ်းသာပါတယ်! ✨':'So glad it hit the spot! ✨'}</p><p class="muted tiny">Would you share it? It really helps our family shop.</p><button class="btn" onclick="extReview()">★ Rate us on Google</button><button class="btn ghost" style="margin-top:10px" onclick="closeSheet();toast('Thank you ☕')">No thanks</button>`}
 else{body.innerHTML=`<p style="font-weight:700">Sorry it missed. What happened?</p><textarea class="ta" aria-label="What could we do better" placeholder="Tell us what we could do better…"></textarea><button class="btn" style="margin-top:10px" onclick="closeSheet();toast('Thank you — we will make it right')">Send privately</button><p class="disc">This goes straight to the owners, not a public review. <a href="#" onclick="extReview();return false" style="color:var(--ac);font-weight:700">Post publicly anyway</a></p>`}}
function extReview(){track('review_redirect','google');closeSheet();toast('Opening Google reviews…')}


/* ---------- INIT ---------- */
function resetApp(){clearTimers();S={tab:'order',mode:null,table:null,slot:null,cart:[],party:[{n:'You',c:'#A65F10'}],filter:'all',diets:[],q:'',tip:0,split:'even',promo:null,locked:false,gems:140,tier:2,theme:S.theme,lang:S.lang,placed:false,trackStep:0,fbRating:0,events:[],loaded:false,_timers:[],presence:false};$('#trkBadge').style.display='none';track('session_start');render()}
document.addEventListener('keydown',e=>{if($('#sheetwrap').classList.contains('on')){if(e.key==='Escape')closeSheet();else if(e.key==='Tab'&&!curTrap)trapTab(e)}});
track('app_open');render();
</script>
</body></html>
