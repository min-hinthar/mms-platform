name: Claude PR Review
# Automated review on every PR push. Grounds findings in the live Vercel preview.
# Auth (Max-plan quota): `claude setup-token` → `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
# Optional: VERCEL_TOKEN secret + VERCEL_PROJECT_ID/VERCEL_TEAM_ID repo vars enrich the preview context.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  deployments: read
  statuses: read

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # skip forks (no secrets)
    env:
      CLAUDE_AUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      MAX_THINKING_TOKENS: "31999"   # "ultrathink"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Vercel preview
        id: vercel
        continue-on-error: true
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        with:
          github-token: ${{ github.token }}
          environment: preview
          timeout: ${{ vars.VERCEL_WAIT_TIMEOUT || 600 }}
          check-interval: 10

      - name: Build Vercel context
        if: ${{ always() }}
        env:
          VERCEL_URL_OUT: ${{ steps.vercel.outputs.deployment-url }}
          VERCEL_STATE_OUT: ${{ steps.vercel.outputs.deployment-state }}
          VERCEL_OUTCOME: ${{ steps.vercel.outcome }}
        run: |
          set -uo pipefail
          jq -n --arg url "${VERCEL_URL_OUT:-}" --arg state "${VERCEL_STATE_OUT:-}" --arg outcome "${VERCEL_OUTCOME:-}" \
            '{preview_url:$url, deployment_state:$state, wait_outcome:$outcome}' > vercel-context.json
          echo "vercel-context.json:"; cat vercel-context.json

      - name: Claude review
        if: ${{ env.CLAUDE_AUTH_PRESENT == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ultrathink.
            You are running an automated review of PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.
            Follow `.github/claude-review-prompt.md` exactly (severity calibration + output format).
            Procedure:
              1. Read `.claude/CLAUDE.md` (Critical / money + auth paths) and `.github/claude-review-prompt.md`.
              2. Read `vercel-context.json` (preview URL + build state for this commit) and reference it.
              3. Run `gh pr diff ${{ env.PR_NUMBER }}` and `gh pr view ${{ env.PR_NUMBER }}`; open changed files + their callers/tests.
              4. Post severity-tagged INLINE comments via mcp__github_inline_comment__create_inline_comment,
                 plus ONE summary via `gh pr comment ${{ env.PR_NUMBER }} --body "..."` including a
                 "Deployment & runtime context" section with the preview URL + build state.
            Be direct. If it's clean, say so briefly — don't manufacture findings.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-4-8' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Read,Grep,Glob"

      - name: Setup checklist (Claude auth not configured)
        if: ${{ env.CLAUDE_AUTH_PRESENT != 'true' }}
        run: echo "::notice title=Claude PR Review::Add CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) in Settings → Secrets → Actions, then re-run."

  security:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude security review
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: anthropics/claude-code-security-review@main
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          comment-pr: true
