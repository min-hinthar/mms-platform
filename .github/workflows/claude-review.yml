name: PR checks (Claude review runs in-session, not in CI)
# Claude review/security/adversarial are NO LONGER run in CI — they were token-metered and drove a
# reactive loop (P1.5 took 6 adversarial rounds, each a metered run + a disable-auto-merge / fix /
# remove-and-re-add-label / re-arm dance — see .claude/LEARNINGS.md). The REAL review is a fresh-context
# adversarial SUBAGENT the working session runs IN-SESSION at pre-PR and pre-merge (the CLAUDE.md Pre-PR
# sweep), which posts its verdict to the PR for the audit trail.
#
# These jobs are ZERO-TOKEN, always-green STUBS. They exist only so the branch-protection required
# checks named `review`, `security`, and `adversarial-pr` keep reporting green on each commit — without
# them, removing the old workflows would leave those required checks permanently "expected" and block
# every merge. Once those names are dropped from branch protection (Settings → Branches), delete this
# file entirely. No Claude / no quota runs here.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Claude review runs in-session (fresh-context subagent, pre-PR + pre-merge) — see CLAUDE.md. Zero-token stub."
  security:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Security lens runs inside the in-session adversarial subagent — see CLAUDE.md. Zero-token stub."
  adversarial-pr:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Adversarial pass runs in-session (fresh-context subagent, pre-merge) and posts its verdict to the PR — see CLAUDE.md. Zero-token stub."
