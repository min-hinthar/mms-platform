name: Claude PR Review
# Automated review + security pass. The Claude step is token-metered (Max-plan quota), so it runs
# ON DEMAND, not on every push: the actual review fires on `opened` / `ready_for_review` (the first
# look) or when you add the `review` label (re-review after addressing comments). On a plain
# `synchronize` (push) the job no-ops to SUCCESS — so if these are required status checks they still
# report green on the new head SHA, but without burning quota re-reviewing the whole diff each push
# (which previously re-surfaced the same findings round after round — see .claude/LEARNINGS.md).
# The deep pre-merge pass is adversarial-pr.yml (the `adversarial` label).
#
# Setup (one-time): install the Claude GitHub App, then add the OAuth token (no per-token billing):
#   claude setup-token  →  gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo min-hinthar/mms-platform
# Action inputs evolve — if a step errors, check anthropics/claude-code-action releases and pin a tag.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# One pass per PR at a time — a newer event cancels an in-flight run (no stacked reviews).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Run the actual review only on open / ready / the `review` label. On synchronize (push) or any
    # other label the steps skip and the job succeeds — keeps a required check green without re-running.
    env:
      RUN_PASS: ${{ !github.event.pull_request.draft && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'review')) }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.RUN_PASS == 'true' }}
        with:
          fetch-depth: 0
      - name: Claude code review
        if: ${{ env.RUN_PASS == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Review this pull request against our standards. Focus on:
            (1) server-authoritative pricing — no client-trusted amounts reach Stripe;
            (2) Supabase RLS correctness + the table-session auth model;
            (3) Stripe webhook idempotency + PCI (no PAN in our code);
            (4) accessibility (focus, aria, labels);
            (5) the items in docs/REVIEW.md and the QA checklist.
            Leave inline comments on problems and a short summary. Be specific; cite file:line.
          # Grant the comment-posting tools (default tool set excludes them, so the agent ran but
          # couldn't post — reviews never appeared). Mirrors the delivery app's working config.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Read,Grep,Glob"

  security:
    runs-on: ubuntu-latest
    # Same on-demand gate as `review` (open / ready / `review` label); no-op success on plain pushes.
    env:
      RUN_PASS: ${{ !github.event.pull_request.draft && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == 'review')) }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.RUN_PASS == 'true' }}
        with:
          fetch-depth: 0
      - name: Claude security review
        if: ${{ env.RUN_PASS == 'true' }}
        # claude-code-security-review only accepts an ANTHROPIC_API_KEY (per-token billing) and
        # rejects claude-code-oauth-token, so it errored on every PR. Run the security pass through
        # claude-code-action instead — same OAuth/Max-plan token as the review job, no API billing.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Perform a SECURITY review of this pull request — think like an attacker and prioritise
            our money + auth paths. Check: (1) server-authoritative pricing — the Stripe intent
            amount must derive from getCartTotals, never the request body; (2) Supabase RLS + the
            short-lived table-session JWT (is_member / is_host), private Realtime channels, and that
            SUPABASE_SERVICE_ROLE_KEY never reaches the client; (3) Server Actions are public POST
            endpoints — flag any that mutate without a session-membership + lock check (IDOR);
            (4) Stripe webhook signature verification + idempotency, and no PAN anywhere in our code;
            (5) injection, secret leakage, SSRF, unsafe deserialization, and risky dependencies.
            Leave inline comments citing file:line with a concrete fix, plus a short risk summary.
            If nothing material turns up, say so explicitly.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Read,Grep,Glob"
