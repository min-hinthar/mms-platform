name: Claude PR Review
# Automated code review on every PR. PUBLIC repo → unlimited Actions minutes.
# Setup (one-time): install the Claude GitHub App on the repo, then add the OAuth token
# (Max-plan subscription quota, no per-token API billing):
#   claude setup-token            # run locally, copy the sk-ant-oat01-... token
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo min-hinthar/mms-platform
# Action inputs evolve — if a step errors, check anthropics/claude-code-action releases for the
# current input names and pin a released tag instead of @v1.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Review this pull request against our standards. Focus on:
            (1) server-authoritative pricing — no client-trusted amounts reach Stripe;
            (2) Supabase RLS correctness + the table-session auth model;
            (3) Stripe webhook idempotency + PCI (no PAN in our code);
            (4) accessibility (focus, aria, labels);
            (5) the items in docs/REVIEW.md and the QA checklist.
            Leave inline comments on problems and a short summary. Be specific; cite file:line.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude security review
        # claude-code-security-review only accepts an ANTHROPIC_API_KEY (per-token billing) and
        # rejects claude-code-oauth-token, so it errored on every PR. Run the security pass through
        # claude-code-action instead — same OAuth/Max-plan token as the review job, no API billing.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Perform a SECURITY review of this pull request — think like an attacker and prioritise
            our money + auth paths. Check: (1) server-authoritative pricing — the Stripe intent
            amount must derive from getCartTotals, never the request body; (2) Supabase RLS + the
            short-lived table-session JWT (is_member / is_host), private Realtime channels, and that
            SUPABASE_SERVICE_ROLE_KEY never reaches the client; (3) Server Actions are public POST
            endpoints — flag any that mutate without a session-membership + lock check (IDOR);
            (4) Stripe webhook signature verification + idempotency, and no PAN anywhere in our code;
            (5) injection, secret leakage, SSRF, unsafe deserialization, and risky dependencies.
            Leave inline comments citing file:line with a concrete fix, plus a short risk summary.
            If nothing material turns up, say so explicitly.
