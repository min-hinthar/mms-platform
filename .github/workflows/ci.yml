name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # W22-docs — the docs gate, in CI at last. `check:docs` proves GFM table parity across every
      # tracked .md (prettier INTRODUCES header/delimiter breaks, and GFM then refuses the WHOLE
      # table) and re-MEASURES every count the live-state docs quote (`vitest list` + the mutant
      # registry) instead of trusting the prose. It had been a local-only convention, so a stale
      # count could — and did — sail through every required check; README's test count was wrong for
      # five arcs. Pure file + `vitest list` work: no build, no DB, no network. Runs FIRST because
      # it costs seconds and fails on exactly the kind of drift a reviewer's eye skims past.
      - run: pnpm check:docs
      # W22d-1 (adversarial review, LOW but real) — the theme-parity guard shipped wired ONLY into
      # `verify:slice`, and `verify:slice` is in ZERO workflows. So a hex drift on any of the five
      # surfaces that cannot read a CSS custom property would merge green for anyone who did not run
      # the local gate — which is exactly how the two `sw.ts` values it was written to catch drifted
      # in the first place. A guard with no teeth on the merge path is a guard that documents a rule
      # rather than enforcing it. Same cost profile as check:docs: pure file reads, no build, no DB.
      - run: pnpm check:theme
      # Turborepo runs lint, typecheck, build, test across the affected workspaces (cached).
      # W8 — orphan-suite guard. `vitest run` exits 1 only when ZERO files match its include glob, so
      # a test file dropped outside a workspace's glob is INVISIBLE: it never runs and nothing reports
      # it. A plain shell check, not a vitest test — a test that reads outside its own workspace is
      # itself turbo-cache-exposed and would defeat the purpose.
      #
      # ⚠️ `.test.tsx` is an orphan ANYWHERE. Neither config matches it (apps/qr is `**/*.test.ts`,
      # packages/ui is `src/**/*.test.ts`), so a React component test — the single most likely future
      # orphan — would otherwise be whitelisted by directory and silently never run. When jsdom lands,
      # widen the vitest include FIRST, then relax this.
      - name: No orphaned test files
        run: |
          ts_orphans=$(find . -name '*.test.ts' -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*' \
            | grep -v -E '^\./(apps/qr/|packages/ui/src/)' || true)
          tsx_any=$(find . -name '*.test.tsx' -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*' || true)
          if [ -n "$ts_orphans" ] || [ -n "$tsx_any" ]; then
            echo "::error::Test file(s) that NO vitest config runs — they never execute:"
            [ -n "$ts_orphans" ] && echo "$ts_orphans"
            [ -n "$tsx_any" ] && echo "$tsx_any  (no config includes *.test.tsx — see the note in ci.yml)"
            exit 1
          fi
          echo "No orphaned test files."
      - run: pnpm turbo run lint typecheck build test

  # Proves the DB layer can't drift: the migrations apply cleanly and the committed types match.
  supabase:
    name: migrations-check + types-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the CLI used to generate the committed types so `gen types --local` is byte-identical.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      # migrations-check — boot the local stack, applying supabase/migrations + seed.sql in order.
      # A migration or seed that doesn't apply cleanly fails the job (ubuntu-latest ships Docker).
      # Only the DB is needed (for migrations + `gen types`), so skip the auxiliary containers — it's
      # faster and avoids edge-runtime's flaky `@supabase/pg-delta` npm fetch at boot.
      - name: Apply migrations + seed (migrations-check)
        run: supabase start -x edge-runtime,studio,imgproxy,logflare,vector,mailpit
      # `gen types --local` spawns postgres-meta from public.ecr.aws regardless of the registry override
      # (CLI 2.107.0), and GitHub's shared runner IPs routinely trip ECR Public's anonymous pull rate
      # limit ("docker: toomanyrequests" — two consecutive flakes on 2026-07-07, incl. a re-run). Pre-pull
      # the SAME tag from Supabase's ghcr mirror and retag it with the ECR name, so the gen step finds the
      # image locally and never contacts ECR. The tag tracks the pinned CLI (2.107.0 ships v0.96.1).
      - name: Pre-pull postgres-meta via ghcr (dodge ECR rate limits)
        run: |
          docker pull ghcr.io/supabase/postgres-meta:v0.96.1
          docker tag ghcr.io/supabase/postgres-meta:v0.96.1 public.ecr.aws/supabase/postgres-meta:v0.96.1
      # types-fresh — regenerate types from the just-applied schema; any drift vs the committed
      # file fails the job, so packages/db/src/database.types.ts can never lag the SQL.
      - name: Types are fresh
        run: |
          supabase gen types typescript --local --schema public > packages/db/src/database.types.ts
          git diff --exit-code -- packages/db/src/database.types.ts \
            || { echo "::error::database.types.ts is stale vs supabase/migrations — run 'pnpm db:types' (with the local stack up) and commit."; exit 1; }
      # sql-tests — every file in supabase/tests/ (RLS membership, W8b tax parity, W8d pickup grid).
      # Plain-SQL asserts; ON_ERROR_STOP makes a failed assertion fail the job.
      #
      # GLOBBED, not enumerated: the previous step named one file, so adding a .sql here would have
      # "passed by not existing" — the same falsely-green trap W8 exists to close. The COUNT FLOOR is
      # the other half: a glob alone still succeeds vacuously if the directory is empty or a file is
      # renamed, so the run fails unless it finds at least the files we know are there. Bump the floor
      # when you add one (2 today: rls_membership, tax_parity; W8d adds pickup_slots).
      - name: SQL tests (RLS · tax parity)
        run: |
          shopt -s nullglob
          # REQUIRED files are named EXPLICITLY below — there is deliberately no count floor. A bare
          # count is not enough: once a third file lands, deleting or renaming one of these would still
          # satisfy the count and leave the job green with a whole guard silently gone. Add a new .sql
          # to this list when it becomes load-bearing.
          for required in supabase/tests/rls_membership_test.sql supabase/tests/tax_parity_test.sql supabase/tests/scan_dedupe_test.sql supabase/tests/cash_tip_bound_test.sql supabase/tests/reward_follows_owner_test.sql supabase/tests/pickup_phone_bound_test.sql supabase/tests/w23d_dropped_visibility_test.sql supabase/tests/m87_order_item_seat_test.sql supabase/tests/m96_merge_keeps_adder_test.sql supabase/tests/m97_merge_matches_fulfillment_test.sql supabase/tests/m98_merge_matches_price_test.sql; do
            if [ ! -f "$required" ]; then
              echo "::error::Required SQL test missing: $required (renamed or deleted?)"
              exit 1
            fi
          done
          files=(supabase/tests/*.sql)
          echo "Running ${#files[@]} SQL test file(s): ${files[*]}"
          for f in "${files[@]}"; do
            echo "── $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
      # M102 — the two-session harness. It CANNOT live in supabase/tests/*.sql: the step above globs
      # that directory into `psql -f`, which would try to execute this as SQL. It also cannot roll
      # back (session B must SEE session A's fixtures), so it commits and cleans up by tag — which is
      # why the script itself refuses to run against anything but the local stack.
      - name: Merge-race harness (two concurrent sessions)
        timeout-minutes: 3
        run: |
          # Record the environment rather than inferring it — this harness has already been broken
          # once by an unmeasured assumption about the local stack. The runner's psql major can
          # differ from the server's (config.toml pins 17; ubuntu-latest ships 16).
          psql --version && node --version
          node scripts/verify-merge-race.mjs
      # Can each of those nine scenarios actually FAIL? Ten mutations of the LIVE function, each
      # asserting the pattern matched, the apply succeeded, md5(prosrc) changed, the NAMED scenarios
      # went red and the controls did not — then restoring byte-identically. ~42s measured locally.
      - name: Merge-race mutants (can the guards fail?)
        timeout-minutes: 6
        run: node scripts/verify-merge-race.mjs --mutants
      - name: Stop stack
        if: always()
        run: supabase stop || true
