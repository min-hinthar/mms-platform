name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # W22-docs — the docs gate, in CI at last. `check:docs` proves GFM table parity across every
      # tracked .md (prettier INTRODUCES header/delimiter breaks, and GFM then refuses the WHOLE
      # table) and re-MEASURES every count the live-state docs quote (`vitest list` + the mutant
      # registry) instead of trusting the prose. It had been a local-only convention, so a stale
      # count could — and did — sail through every required check; README's test count was wrong for
      # five arcs. Pure file + `vitest list` work: no build, no DB, no network. Runs FIRST because
      # it costs seconds and fails on exactly the kind of drift a reviewer's eye skims past.
      - run: pnpm check:docs
      # W22d-1 (adversarial review, LOW but real) — the theme-parity guard shipped wired ONLY into
      # `verify:slice`, and `verify:slice` is in ZERO workflows. So a hex drift on any of the five
      # surfaces that cannot read a CSS custom property would merge green for anyone who did not run
      # the local gate — which is exactly how the two `sw.ts` values it was written to catch drifted
      # in the first place. A guard with no teeth on the merge path is a guard that documents a rule
      # rather than enforcing it. Same cost profile as check:docs: pure file reads, no build, no DB.
      - run: pnpm check:theme
      # M70 — same cost profile, same reason. `database.types.ts` is hand-edited whenever the session
      # has no Docker, and the only thing that checks the edit is the `migrations-check + types-fresh`
      # job below: six image pulls and 120 migrations, ~3 minutes, to reject a misplaced line. And
      # because `types-fresh` runs BEFORE that job's SQL tests, a one-line sort slip aborts the stack
      # with every `supabase/tests/*.sql` assertion still unrun — so a migration reads "checked" when
      # nothing about it was. This says the same thing in milliseconds, and names the exact pair.
      - run: pnpm check:types-sorted
      # T6 — `format:check` ran in ZERO workflows, so prettier drift merged silently. `lint` is
      # plain `eslint .` with no prettier plugin, and the three guards above read docs, tokens and
      # generated types — none of them reads general source formatting. Proven live, not theorised:
      # M70's round-1 fix commit pushed an unformatted `create-intent/route.ts` and every required
      # check stayed green; it was caught only because a later local `prettier --check` happened to
      # run. ⚠️ The generated docs are in `.prettierignore` on purpose — prettier INTRODUCES GFM
      # header/delimiter breaks, which is the drift `check:docs` above exists to catch.
      - run: pnpm format:check
      # M149 (Codex P2 on #233 and #227, both post-merge, neither answered) — these two guards were
      # reachable ONLY through the local `pnpm verify:slice`, which no workflow invokes. A
      # contributor who does not run it could merge green with the promo-pin call deleted, or with a
      # malformed migration filename that the Supabase CLI then SILENTLY SKIPS — the exact failure
      # M17 already cost a CI cycle for. Both are file-read-only and take about a second, so the
      # only reason they were not here was that nobody wired them.
      - run: pnpm check:migration-versions
      - run: pnpm check:promo-pin
      - run: pnpm check:pay-attempt
      # J4 (residual) — cross-FILE parity: the client freeze mirrors the server's bare `locked`.
      # File-read-only and parsed, so it rides the fast lane beside the other correctness guards.
      - run: pnpm check:freeze-parity
      # T9 — the same question one layer out: every CHILD component that can fire one of those
      # mutations takes the freeze fact, refuses in its handler, and surfaces the refusal. Its
      # subject set is DERIVED from the lib modules (never a file list — that is what made
      # check:freeze-parity blind to pickup.ts, OPEN-ITEMS T13), so a new lock-bearing module and a
      # new component that fires one both join it automatically.
      - run: pnpm check:child-freeze
      # Turborepo runs lint, typecheck, build, test across the affected workspaces (cached).
      # W8 — orphan-suite guard. `vitest run` exits 1 only when ZERO files match its include glob, so
      # a test file dropped outside a workspace's glob is INVISIBLE: it never runs and nothing reports
      # it. A plain shell check, not a vitest test — a test that reads outside its own workspace is
      # itself turbo-cache-exposed and would defeat the purpose.
      #
      # ⚠️ `.test.tsx` RUNS UNDER apps/qr ONLY (M46, 2026-09-04). apps/qr includes
      # `**/*.test.{ts,tsx}`; packages/ui is still `src/**/*.test.ts`, so a `.test.tsx` THERE runs
      # nowhere and stays an orphan. The two filters below are deliberately different widths —
      # widening the shared one instead would re-open the whitelisted-by-directory hole W8 closed.
      #
      # ⚠️ AND THE ENVIRONMENT IS DECLARED IN THE FILE, NOT THE CONFIG. Vitest picks a file's
      # environment from a `@vitest-environment` docblock BEFORE consulting the config, and its
      # matcher is UNANCHORED — it scans the whole file with no docblock-position constraint. So a
      # `.test.ts` that merely MENTIONS the phrase in a comment switches environment with no count
      # change, no timing change and no other symptom. The pragma block below refuses that, using a
      # verbatim copy of vitest's own regex: the guarded fact IS text, because vitest matches text.
      - name: No orphaned test files
        run: |
          # Enumerated through git, not `find`: only files git would SHIP can answer "a test no
          # config runs". `find` also walks build artifacts and gitignored working directories —
          # `.review-bundle/` (scripts/review-bundle.mjs) copies every changed file, `.test.ts`
          # included, into one flat directory, which reported 30+ phantom orphans locally.
          # `--cached --others --exclude-standard` = tracked + untracked-minus-ignored, so a new
          # test file is still caught before it is committed. Keep this in step with
          # scripts/verify-slice.mjs, which mirrors it.
          all_ts=$(git ls-files --cached --others --exclude-standard -- '*.test.ts')
          # A SECOND pathspec, not a looser one: `git ls-files -- '*.test.ts'` does NOT match
          # `.test.tsx` (measured), so `all_ts` has never once enumerated a tsx file.
          all_tsx=$(git ls-files --cached --others --exclude-standard -- '*.test.tsx')
          # The guard's own self-check: "no orphans" and "nothing was looked at" print the same word.
          # A bare total is not enough — apps/qr alone holds 104 tests, so a listing accidentally
          # scoped to that subtree clears any count floor while packages/*, scripts/ and the repo
          # root go unlooked-at. Require every configured suite root to be represented, which cannot
          # hold for a listing scoped inside one of them. Keep in step with scripts/verify-slice.mjs.
          if [ "$(echo "$all_ts" | grep -c .)" -lt 10 ] \
            || ! echo "$all_ts" | grep -q '^apps/qr/' \
            || ! echo "$all_ts" | grep -q '^packages/ui/src/'; then
            echo "::error::orphan-suite guard did not enumerate the whole repo — it cannot have run."
            echo "$all_ts"
            exit 1
          fi
          ts_orphans=$(echo "$all_ts" | grep -v -E '^(apps/qr/|packages/ui/src/)' || true)
          # NARROWER on purpose — apps/qr only. See the header note.
          tsx_orphans=$(echo "$all_tsx" | grep -v -E '^apps/qr/' || true)
          # BOTH `.spec` suffixes run NOWHERE: apps/qr includes `**/*.test.{ts,tsx}` and packages/ui
          # `src/**/*.test.ts`, so neither is matched by any config, at any path. `.spec` is here
          # because of T5 and Codex P2 on #241 — the downgrade of that row claimed W8's guard had
          # closed the "invisible test" hole, and it had closed it only for the `.test` suffix. A
          # conventional `packages/db/foo.spec.ts` was neither enumerated here nor executed by any
          # package's `test` script, which is the ORIGINAL failure mode intact under a different
          # filename. Rejecting the suffix outright is the honest fix: this repo has one test-file
          # convention, and a file that cannot run should never land quietly.
          nonrunners=$(git ls-files --cached --others --exclude-standard -- '*.spec.ts' '*.spec.tsx' || true)
          if [ -n "$ts_orphans" ] || [ -n "$tsx_orphans" ] || [ -n "$nonrunners" ]; then
            echo "::error::Test file(s) that NO vitest config runs, or that run in the wrong environment:"
            [ -n "$ts_orphans" ] && echo "$ts_orphans"
            [ -n "$tsx_orphans" ] && echo "$tsx_orphans  (.test.tsx runs under apps/qr only — see the note in ci.yml)"
            [ -n "$nonrunners" ] && echo "$nonrunners  (no config includes *.spec.* — see the note in ci.yml)"
            exit 1
          fi
          echo "No orphaned test files."
      # ⚠️ THE SAME CODE verify:slice RUNS, not a POSIX-ERE paraphrase of it. The first draft
      # duplicated vitest's matcher in shell, and the two disagreed where it mattered: JS `\s`
      # spans newlines while grep is line-oriented, so a pragma whose environment word sits on the
      # NEXT line is honoured by vitest, caught by verify:slice, and MISSED here — the looser
      # mirror being the one that gates the merge. Measured on both matchers.
      - name: Test files run in the environment their suffix promises
        run: node scripts/check-test-env.mjs
      - run: pnpm turbo run lint typecheck build test

  # Proves the DB layer can't drift: the migrations apply cleanly and the committed types match.
  supabase:
    name: migrations-check + types-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the CLI used to generate the committed types so `gen types --local` is byte-identical.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      # migrations-check — boot the local stack, applying supabase/migrations + seed.sql in order.
      # A migration or seed that doesn't apply cleanly fails the job (ubuntu-latest ships Docker).
      # Only the DB is needed (for migrations + `gen types`), so skip the auxiliary containers — it's
      # faster and avoids edge-runtime's flaky `@supabase/pg-delta` npm fetch at boot.
      - name: Apply migrations + seed (migrations-check)
        run: supabase start -x edge-runtime,studio,imgproxy,logflare,vector,mailpit
      # `gen types --local` spawns postgres-meta from public.ecr.aws regardless of the registry override
      # (CLI 2.107.0), and GitHub's shared runner IPs routinely trip ECR Public's anonymous pull rate
      # limit ("docker: toomanyrequests" — two consecutive flakes on 2026-07-07, incl. a re-run). Pre-pull
      # the SAME tag from Supabase's ghcr mirror and retag it with the ECR name, so the gen step finds the
      # image locally and never contacts ECR. The tag tracks the pinned CLI (2.107.0 ships v0.96.1).
      - name: Pre-pull postgres-meta via ghcr (dodge ECR rate limits)
        run: |
          docker pull ghcr.io/supabase/postgres-meta:v0.96.1
          docker tag ghcr.io/supabase/postgres-meta:v0.96.1 public.ecr.aws/supabase/postgres-meta:v0.96.1
      # types-fresh — regenerate types from the just-applied schema; any drift vs the committed
      # file fails the job, so packages/db/src/database.types.ts can never lag the SQL.
      - name: Types are fresh
        run: |
          supabase gen types typescript --local --schema public > packages/db/src/database.types.ts
          git diff --exit-code -- packages/db/src/database.types.ts \
            || { echo "::error::database.types.ts is stale vs supabase/migrations — run 'pnpm db:types' (with the local stack up) and commit."; exit 1; }
      # sql-tests — every file in supabase/tests/ (RLS membership, W8b tax parity, W8d pickup grid).
      # Plain-SQL asserts; ON_ERROR_STOP makes a failed assertion fail the job.
      #
      # GLOBBED, not enumerated: the previous step named one file, so adding a .sql here would have
      # "passed by not existing" — the same falsely-green trap W8 exists to close. The COUNT FLOOR is
      # the other half: a glob alone still succeeds vacuously if the directory is empty or a file is
      # renamed, so the run fails unless it finds at least the files we know are there. Bump the floor
      # when you add one (2 today: rls_membership, tax_parity; W8d adds pickup_slots).
      - name: SQL tests (RLS · tax parity)
        run: |
          shopt -s nullglob
          # REQUIRED files are named EXPLICITLY below — there is deliberately no count floor. A bare
          # count is not enough: once a third file lands, deleting or renaming one of these would still
          # satisfy the count and leave the job green with a whole guard silently gone. Add a new .sql
          # to this list when it becomes load-bearing.
          for required in supabase/tests/rls_membership_test.sql supabase/tests/tax_parity_test.sql supabase/tests/scan_dedupe_test.sql supabase/tests/cash_tip_bound_test.sql supabase/tests/reward_follows_owner_test.sql supabase/tests/pickup_phone_bound_test.sql supabase/tests/w23d_dropped_visibility_test.sql supabase/tests/m87_order_item_seat_test.sql supabase/tests/m96_merge_keeps_adder_test.sql supabase/tests/m97_merge_matches_fulfillment_test.sql supabase/tests/m98_merge_matches_price_test.sql supabase/tests/m100_session_mode_authority_test.sql supabase/tests/m17_line_tax_category_test.sql supabase/tests/m109_merge_matches_mode_test.sql supabase/tests/advisor_sweep_test.sql supabase/tests/m22_promo_consumed_on_its_own_contribution_test.sql supabase/tests/m70_promo_grant_survives_settlement_test.sql supabase/tests/m72_settlement_derives_availability_test.sql; do
            if [ ! -f "$required" ]; then
              echo "::error::Required SQL test missing: $required (renamed or deleted?)"
              exit 1
            fi
          done
          files=(supabase/tests/*.sql)
          echo "Running ${#files[@]} SQL test file(s): ${files[*]}"
          for f in "${files[@]}"; do
            echo "── $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
      # M102 — the two-session harness. It CANNOT live in supabase/tests/*.sql: the step above globs
      # that directory into `psql -f`, which would try to execute this as SQL. It also cannot roll
      # back (session B must SEE session A's fixtures), so it commits and cleans up by tag — which is
      # why the script itself refuses to run against anything but the local stack.
      - name: Merge-race harness (two concurrent sessions)
        timeout-minutes: 3
        run: |
          # Record the environment rather than inferring it — this harness has already been broken
          # once by an unmeasured assumption about the local stack. The runner's psql major can
          # differ from the server's (config.toml pins 17; ubuntu-latest ships 16).
          psql --version && node --version
          node scripts/verify-merge-race.mjs
      # Can each of those nine scenarios actually FAIL? Ten mutations of the LIVE function, each
      # asserting the pattern matched, the apply succeeded, md5(prosrc) changed, the NAMED scenarios
      # went red and the controls did not — then restoring byte-identically. ~42s measured locally.
      - name: Merge-race mutants (can the guards fail?)
        timeout-minutes: 6
        run: node scripts/verify-merge-race.mjs --mutants
      # M100 · M107 · M17 — can each case in the SQL suites actually FAIL? plpgsql ASSERT stops at the
      # FIRST one, so running either file red-then-green proves ONE case and silently skips the rest.
      # 20 mutations across three LIVE functions (mms_set_line_fulfillment, mms_fire_line and
      # mms_cart_item_insert_if_open) plus one of mms_init_togo_status — the only way to falsify the
      # end-to-end case — each requiring a green baseline first, a body hash that actually changed,
      # and the NAMED case (not just some case) to be the one that goes red. Two mutants are
      # documented SURVIVORS and are asserted as such rather than left as untested comments.
      # The battery replays an ordered migration CHAIN and verifies from the migration FILENAMES that
      # its chain is complete: a function whose last definition moves outside the chain ABORTS the
      # run, because every verdict about it would otherwise be about a body the database never runs.
      # Keep this count in step — measured with:
      #   grep -c 'id: "' scripts/verify-mode-authority.mjs
      - name: Mode-authority mutants (can the guards fail?)
        timeout-minutes: 5
        run: node scripts/verify-mode-authority.mjs
      - name: Stop stack
        if: always()
        run: supabase stop || true
