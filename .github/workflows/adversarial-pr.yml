name: Adversarial PR Review
# Per-PR adversarial pass — scoped to the diff, fast enough to gate merges.
# The weekly whole-repo pass lives in adversarial.yml.
# Auth: Claude Code OAuth token (Max-plan quota).
on:
  pull_request:
    # opened/synchronize/reopened/ready_for_review → runs on every push, so an
    # adversarial pass always precedes merge. `labeled` → lets you re-prompt the
    # gate before merging without a new commit (add the `adversarial` label).
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: adversarial-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adversarial-pr:
    # Run on every push event; on a `labeled` event run ONLY for the `adversarial`
    # label, so unrelated labels don't burn a review. Drafts are skipped.
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'adversarial') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude adversarial pass (diff-scoped)
        id: adversarial
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Adversarial review of THIS PR ONLY (the diff vs base). Four lenses:
            accessibility, performance, security & privacy, product/UX correctness.
            Verify by reading the code (cite file:line); zero reflexive praise. Pay
            special attention to the money + auth paths: server-authoritative pricing,
            Supabase RLS + the table-session JWT, Stripe webhook idempotency/PCI, no
            PAN in our code. Cross-check `docs/REVIEW.md` "Still open" items and
            `docs/ARCHITECTURE.md` invariants.

            POST a single PR comment with a severity-ranked findings table
            (Critical / High / Medium / Low · file:line · suggested fix) if you can.
            Then, as the FINAL line of your response and NOWHERE else, print the verdict
            marker: the word ADVERSARIAL_VERDICT, then a colon and a space, then PASS if
            there are zero Critical findings or BLOCK if there is any Critical finding.
          # Grant the comment-posting tools so the findings table actually lands on the PR (the
          # default tool set excludes them). The gate still reads the verdict from the execution log
          # as a backup, so a missed post can't make a clean PR fail.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Read,Grep,Glob"
      - name: Gate on adversarial verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXEC_FILE: ${{ steps.adversarial.outputs.execution_file }}
        run: |
          set -uo pipefail
          # Fail-CLOSED: the gate passes only on an explicit `ADVERSARIAL_VERDICT: PASS`.
          # All matching is done with bash `case` on a captured variable — NOT `echo "$x" | grep`,
          # which broke the pipe for large input: grep -q exits on first match and closes the pipe,
          # echo dies with EPIPE (141), and under `pipefail` that 141 became the pipeline status, so a
          # MATCHED verdict read as "not found". `case` has no subprocess/pipe, so no EPIPE.
          #
          # Escape hatch (for PRs that edit a claude-*/adversarial-* workflow, whose own adversarial
          # review the action skips, anti-tampering): the `adversarial-signed-off` LABEL, or a sign-off
          # COMMENT from a repo collaborator (OWNER/MEMBER/COLLABORATOR) carrying ADVERSARIAL_SIGNOFF —
          # same collaborator-gated trust; external commenters (NONE/CONTRIBUTOR) cannot sign off.
          LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)"
          case $'\n'"$LABELS"$'\n' in
            *$'\n'adversarial-signed-off$'\n'*)
              echo "::notice title=Adversarial::Manual sign-off label present — gate satisfied."
              exit 0 ;;
          esac
          SIGNOFF="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.author_association=="OWNER" or .author_association=="MEMBER" or .author_association=="COLLABORATOR") | .body] | join("\n")' 2>/dev/null || true)"
          case "$SIGNOFF" in
            *ADVERSARIAL_SIGNOFF*)
              echo "::notice title=Adversarial::Manual collaborator sign-off comment present — gate satisfied."
              exit 0 ;;
          esac
          # Verdict from the agent's execution log (authoritative — written by the action even when the
          # agent can't POST a comment) + any bot comment. The prompt avoids the literal
          # `ADVERSARIAL_VERDICT: PASS/BLOCK` tokens, so a match means the agent's real emission.
          SOURCES=""
          for f in "${EXEC_FILE:-}" "${RUNNER_TEMP:-/home/runner/work/_temp}/claude-execution-output.json"; do
            if [ -n "$f" ] && [ -f "$f" ]; then SOURCES="${SOURCES}"$'\n'"$(cat "$f")"; fi
          done
          SOURCES="${SOURCES}"$'\n'"$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.type=="Bot") | .body] | join("\n")' 2>/dev/null || true)"
          case "$SOURCES" in
            *"ADVERSARIAL_VERDICT: BLOCK"*)
              echo "::error title=Adversarial::Critical findings — see the run log / PR comment."
              exit 1 ;;
          esac
          case "$SOURCES" in
            *"ADVERSARIAL_VERDICT: PASS"*)
              echo "::notice title=Adversarial::PASS."
              exit 0 ;;
          esac
          echo "::error title=Adversarial::No ADVERSARIAL_VERDICT found — the pass did not run (workflow-edit anti-tampering skip, error, or rate-limit). Re-run it, or add the 'adversarial-signed-off' label after a manual review."
          exit 1
