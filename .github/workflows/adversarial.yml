name: Weekly Adversarial Review
# Deep, whole-repo red-team — beyond the per-PR review. Opens an issue with findings.
# Auth: Claude Code OAuth token (Max-plan quota). One-time: `claude setup-token` then
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
on:
  schedule:
    - cron: "0 16 * * 1"   # Mondays 16:00 UTC (~9am PT)
  workflow_dispatch:        # run on demand from the Actions tab

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude adversarial pass
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Run a deep adversarial review of this whole repository across four lenses —
            accessibility, performance, security & privacy, and product/UX correctness.
            Verify every claim by reading the code (cite file:line); do not praise reflexively.
            Cross-check the "Still open" items in docs/REVIEW.md and the standards in
            docs/ARCHITECTURE.md and docs/WORKFLOW.md. Pay special attention to the money +
            auth paths: server-authoritative pricing, Supabase RLS + the table-session JWT,
            and Stripe webhook idempotency/PCI. Grade against a 10-dimension world-class rubric.
            Then OPEN A GITHUB ISSUE titled "Weekly adversarial review — <today's date>" with a
            severity-ranked findings table (Critical/High/Med/Low · file:line · fix) and the top
            5 fixes. Apply labels "adversarial" and "type:security".
